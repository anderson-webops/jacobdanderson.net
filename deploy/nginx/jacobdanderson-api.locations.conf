# Include this inside the existing TLS server for jacobdanderson.net.
location = /_dbinfo {
	return 404;
}

location ~ ^/accounts(?:/|$) {
	return 404;
}

location = /admin {
	if ($request_method !~ ^(GET|HEAD)$) { return 405; }
	auth_basic "Project administration";
	auth_basic_user_file /etc/nginx/jacobdanderson-admin.htpasswd;
	try_files /admin/index.html =404;
	# Nginx does not inherit server-level add_header directives when a
	# location declares one, so preserve the complete security policy here.
	add_header Cache-Control "no-store" always;
	add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; connect-src 'self'; frame-src 'none'; media-src 'self'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cross-Origin-Resource-Policy "same-origin" always;
	add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location ^~ /admin/ {
	if ($request_method !~ ^(GET|HEAD)$) { return 405; }
	auth_basic "Project administration";
	auth_basic_user_file /etc/nginx/jacobdanderson-admin.htpasswd;
	try_files $uri $uri/index.html =404;
	# Nginx does not inherit server-level add_header directives when a
	# location declares one, so preserve the complete security policy here.
	add_header Cache-Control "no-store" always;
	add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; connect-src 'self'; frame-src 'none'; media-src 'self'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cross-Origin-Resource-Policy "same-origin" always;
	add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location = /api/healthz {
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_connect_timeout 3s;
	proxy_read_timeout 5s;
	proxy_pass http://127.0.0.1:3003/api/healthz;
}

location = /api/readyz {
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_connect_timeout 3s;
	proxy_read_timeout 5s;
	proxy_pass http://127.0.0.1:3003/api/readyz;
}

location = /api/projects/visibility {
	if ($request_method !~ ^(GET|HEAD)$) { return 405; }
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Portfolio-Admin-Key "";
	proxy_connect_timeout 3s;
	proxy_read_timeout 5s;
	proxy_pass http://127.0.0.1:3003/api/projects/visibility;
}

location ^~ /api/admin/projects/ {
	if ($request_method != PATCH) { return 405; }
	auth_basic "Project administration";
	auth_basic_user_file /etc/nginx/jacobdanderson-admin.htpasswd;
	client_max_body_size 2k;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Authorization "";
	include /etc/nginx/snippets/jacobdanderson-admin-secret.conf;
	proxy_connect_timeout 3s;
	proxy_read_timeout 5s;
	proxy_pass http://127.0.0.1:3003;
}

location ^~ /api/ {
	return 404;
}
