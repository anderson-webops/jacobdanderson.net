# Include this inside the existing TLS server for jacobdanderson.net.
location = /_dbinfo {
	return 404;
}

location ~ ^/(?:accounts|admin)(?:/|$) {
	return 404;
}

location = /api/healthz {
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_connect_timeout 3s;
	proxy_read_timeout 5s;
	proxy_pass http://127.0.0.1:3003/api/healthz;
}

location = /api/readyz {
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_connect_timeout 3s;
	proxy_read_timeout 5s;
	proxy_pass http://127.0.0.1:3003/api/readyz;
}

location ^~ /api/ {
	return 404;
}
