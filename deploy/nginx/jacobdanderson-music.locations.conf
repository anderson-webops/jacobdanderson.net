location = /music-library/catalog.json {
	if ($request_method !~ ^(GET|HEAD)$) { return 405; }
	root /srv/jacobdanderson.net/media;
	default_type application/json;
	expires -1;
	try_files $uri =404;
}

location ~ "^/music-library/audio/[a-z0-9]+(?:-[a-z0-9]+)*-[a-f0-9]{12}\.mp3$" {
	if ($request_method !~ ^(GET|HEAD)$) { return 405; }
	root /srv/jacobdanderson.net/media;
	types { audio/mpeg mp3; }
	max_ranges 1;
	expires 1y;
	try_files $uri =404;
}

location /music-library/ { return 404; }
