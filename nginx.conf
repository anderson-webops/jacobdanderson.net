server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;
	server_tokens off;

	add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://analytics.jacobdanderson.net; connect-src 'self' https://analytics.jacobdanderson.net; frame-src 'none'; media-src 'self'; worker-src 'self'; manifest-src 'self'" always;
	add_header Cross-Origin-Opener-Policy "same-origin" always;
	add_header Cross-Origin-Resource-Policy "same-origin" always;
	add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;

	location = /healthz {
		access_log off;
		default_type application/json;
		return 200 '{"ok":true}';
	}

	location = /deployment.json {
		expires -1;
		try_files $uri =404;
	}

	location /assets/ {
		try_files $uri =404;
		expires max;
	}

	location ~ /\. {
		deny all;
	}

	location / {
		limit_except GET HEAD {
			deny all;
		}
		try_files $uri $uri/ $uri/index.html =404;
	}
}
